# 테스트 컨텍스트용 설정 (H2 인메모리, Oracle 모드)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Redis/Kafka/세션은 운영에서만 씀. 테스트는 인메모리라 오토컨피그 빼버림
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# @Value 플레이스홀더 더미값 (컨텍스트 로딩용)
api.kma.serviceKey=test
api.kakao.restKey=test
api.kakao.jsKey=test
file.upload.dir=${java.io.tmpdir}/safetynevi-test/
file.upload.inquiry=${java.io.tmpdir}/safetynevi-test/
file.upload.notice=${java.io.tmpdir}/safetynevi-test/
