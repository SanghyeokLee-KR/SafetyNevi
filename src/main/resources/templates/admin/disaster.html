<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 재난 관리 — 안전네비</title>
    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/components.css">
    <link rel="stylesheet" href="/css/admin/disaster.css">
    <link rel="icon" type="image/png" href="/img/logo/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="/js/common/csrf.js"></script>
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('disaster')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">재난 시뮬레이션 및 관리</div>
            <div class="page-subtitle">실제 상황을 가정해 재난 경보를 생성하고 관리합니다.</div>
        </div>
        <button id="btn-refresh-disasters" type="button" class="btn-search" style="display:inline-flex; align-items:center; gap:7px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            현황 새로고침
        </button>
    </div>

    <div class="dashboard-section">
        <div class="section-header">현재 발효 중인 재난</div>
        <div class="table-container" style="margin-top:0; box-shadow:none; border:1px solid var(--border);">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:70px;">ID</th>
                    <th>재난 유형</th>
                    <th>발생 위치 / 지역</th>
                    <th>남은 시간</th>
                    <th style="width:100px; text-align:right;">관리</th>
                </tr>
                </thead>
                <tbody id="disaster-list-body">
                <tr><td colspan="5" style="text-align:center; padding:32px; color:var(--text-subtle);">데이터 로딩 중…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="section-header">재난 생성 시뮬레이터</div>

        <div style="background:var(--surface-2); padding:20px; border-radius:var(--r-md); margin-bottom:16px;">
            <label class="form-label">중심 위치 설정 (주소 검색)</label>
            <div class="input-group">
                <input type="text" id="address" class="form-input" placeholder="발생 지역을 검색하세요 (예: 강남역, 부산시청)" readonly>
                <button id="search-address-btn" class="btn-search">주소 찾기</button>
            </div>
            <input type="hidden" id="lat"><input type="hidden" id="lon"><input type="hidden" id="areaName">
        </div>

        <div class="sim-grid">
            <div class="sim-card">
                <div class="sim-title" style="color: var(--primary-color);">원형 재난 (좌표 기준)</div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">재난 유형</label>
                    <select id="type-circle" class="form-select">
                        <option value="fire">화재/폭발</option>
                        <option value="missile">미사일/공습</option>
                        <option value="quake">지진 (진앙지)</option>
                        <option value="lightning">낙뢰</option>
                        <option value="heavyRain">국지성 호우</option>
                    </select>
                </div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">반경 (미터)</label>
                    <input type="number" id="radius" class="form-input" value="1000" placeholder="예: 1000">
                </div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">지속 시간 (분)</label>
                    <input type="number" id="duration-circle" class="form-input" value="30">
                </div>
                <button id="simulate-btn-circle" class="btn-block btn-primary-block">원형 재난 발령</button>
            </div>

            <div class="sim-card">
                <div class="sim-title" style="color: #ef4444;">지역 재난 (행정구역 기준)</div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">대상 행정구역</label>
                    <input type="text" id="areaName-display" class="form-input" value="-" readonly style="color:#ef4444; font-weight:bold;">
                </div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">재난 유형</label>
                    <select id="type-area" class="form-select">
                        <option value="heavyRain">호우 경보</option>
                        <option value="typhoon">태풍</option>
                        <option value="heatwave">폭염 경보</option>
                        <option value="heavysnow">대설 주의보</option>
                        <option value="fire">산불 (광범위)</option>
                    </select>
                </div>
                <div style="margin-bottom:15px;">
                    <label class="form-label">지속 시간 (분)</label>
                    <input type="number" id="duration-area" class="form-input" value="60">
                </div>
                <button id="simulate-btn-area" class="btn-block btn-danger-block">지역 재난 발령</button>
            </div>
        </div>
    </div>
</main>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script type="text/javascript" th:src="@{'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoJsKey} + '&libraries=services'}"></script>
<script type="module" src="/js/admin/disaster.js"></script>

</body>
</html>
