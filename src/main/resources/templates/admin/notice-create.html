<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 공지 관리 — 안전네비</title>
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/components.css}">
    <link rel="stylesheet" th:href="@{/css/admin/notice-create.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo/favicon.png}">
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('notice')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">공지 관리</div>
            <div class="page-subtitle">전체 회원에게 보여질 공지사항을 등록·관리합니다.</div>
        </div>
        <button type="button" class="btn-main-action" onclick="openModal()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            공지 작성
        </button>
    </div>

    <div th:if="${noticeError}" th:text="${noticeError}"
         style="margin-bottom:16px;padding:12px 16px;border-radius:8px;background:var(--danger-soft);color:#b42318;border:1px solid #fecdca;"></div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th style="width:60px;">No.</th>
                <th style="width:90px;">유형</th>
                <th>제목</th>
                <th style="width:110px;">작성자</th>
                <th style="width:120px;">작성일</th>
                <th style="width:70px;">조회</th>
                <th style="width:80px; text-align:right;">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${notices.isEmpty()}">
                <td colspan="7" style="text-align:center; padding:48px; color:var(--text-subtle);">등록된 공지사항이 없습니다.</td>
            </tr>

            <tr th:each="notice : ${notices.content}"
                th:classappend="${notice.type == 'EMERGENCY'} ? 'tr-emergency'">
                <td style="color:var(--text-subtle);" th:text="${notice.id}">105</td>
                <td>
                    <span th:if="${notice.type == 'EMERGENCY'}" class="role-badge emergency">긴급</span>
                    <span th:if="${notice.type == 'IMPORTANT'}" class="role-badge important">중요</span>
                    <span th:if="${notice.type == 'GENERAL'}" class="role-badge general">일반</span>
                </td>
                <td th:classappend="${notice.type == 'EMERGENCY'} ? 'text-emergency' : (${notice.type == 'IMPORTANT'} ? 'text-important')">
                    <a th:href="@{/noticeDetail(id=${notice.id})}" target="_blank"
                       style="text-decoration:none; color:inherit; font-weight:600;"
                       th:text="${notice.title}">제목</a>
                </td>
                <td th:text="${notice.writerName}">관리자</td>
                <td th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd')}">2024-11-30</td>
                <td th:text="${notice.viewCount}">0</td>
                <td style="text-align:right;">
                    <form th:action="@{/admin/notice/delete/{id}(id=${notice.id})}" method="post"
                          onsubmit="return confirm('정말 이 공지사항을 삭제하시겠습니까?');">
                        <button type="submit" class="btn-danger-soft">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="admin-pagination" th:if="${notices.totalPages > 1}">
        <a th:href="@{/admin/notice/create(page=${notices.number - 1})}" th:classappend="${notices.first} ? 'disabled'">이전</a>
        <a th:each="p : ${#numbers.sequence(0, notices.totalPages - 1)}"
           th:if="${p >= notices.number - 2 and p <= notices.number + 2}"
           th:href="@{/admin/notice/create(page=${p})}" th:text="${p + 1}"
           th:classappend="${p == notices.number} ? 'active'">1</a>
        <a th:href="@{/admin/notice/create(page=${notices.number + 1})}" th:classappend="${notices.last} ? 'disabled'">다음</a>
    </div>
</main>

<div id="noticeModal" class="modal-overlay">
    <div class="modal-window">
        <form th:action="@{/admin/notice/NoticeWrite}" method="post" enctype="multipart/form-data">
            <div class="modal-header">
                <span>신규 공지 등록</span>
                <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div style="margin-bottom:20px;">
                <label class="form-label">제목</label>
                <input type="text" name="title" class="form-input" placeholder="공지 제목을 입력하세요" required>
            </div>
            <div style="margin-bottom:20px;">
                <label class="form-label">중요도 설정</label>
                <select name="type" class="form-select">
                    <option value="GENERAL">일반 공지</option>
                    <option value="IMPORTANT">중요 (상단 고정)</option>
                    <option value="EMERGENCY">긴급 (메인 팝업)</option>
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label class="form-label">내용</label>
                <textarea name="content" class="form-input" rows="8" placeholder="공지 내용을 입력하세요"></textarea>
            </div>
            <div style="margin-bottom:20px;">
                <label class="form-label">첨부파일 (선택)</label>
                <input type="file" name="file" class="form-input">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-danger-soft btn-cancel" onclick="closeModal()">취소</button>
                <button type="submit" class="btn-search btn-submit">등록하기</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal() { document.getElementById('noticeModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('noticeModal').style.display = 'none'; }
    window.onclick = function (event) {
        if (event.target === document.getElementById('noticeModal')) closeModal();
    };
</script>
</body>
</html>
