<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 회원 관리, 안전네비</title>
    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/components.css">
    <link rel="icon" type="image/png" href="/img/logo/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="/js/common/csrf.js"></script>
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('members')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">회원 관리</div>
            <div class="page-subtitle">총 <strong th:text="${members.totalElements}">0</strong>명의 회원</div>
        </div>
    </div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th>아이디</th>
                <th>이름 / 닉네임</th>
                <th>연락처</th>
                <th>가입일</th>
                <th>권한</th>
                <th style="text-align:right;">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members.content}">
                <td style="font-weight:700;" th:text="${m.userId}">user01</td>
                <td>
                    <div style="font-weight:600;" th:text="${m.name}">홍길동</div>
                    <div style="font-size:12px; color:var(--text-subtle);" th:text="${m.nickname}">닉네임</div>
                </td>
                <td th:text="${m.emergencyPhone}">010-0000-0000</td>
                <td th:text="${m.joinDate != null ? #temporals.format(m.joinDate, 'yyyy-MM-dd') : '-'}">2024-01-01</td>
                <td>
                    <span class="role-badge admin" th:if="${m.userId == 'admin'}">관리자</span>
                    <span class="role-badge user" th:unless="${m.userId == 'admin'}">일반</span>
                </td>
                <td style="text-align:right;">
                    <button th:if="${m.userId != 'admin'}" class="btn-danger-soft"
                            th:data-id="${m.userId}" onclick="deleteMember(this.getAttribute('data-id'))">강제 탈퇴</button>
                    <span th:if="${m.userId == 'admin'}" style="color:var(--text-subtle); font-size:12px;">—</span>
                </td>
            </tr>
            <tr th:if="${members.totalElements == 0}">
                <td colspan="6" style="text-align:center; padding:48px; color:var(--text-subtle);">가입된 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="admin-pagination" th:if="${members.totalPages > 1}">
        <a th:href="@{/admin/members(page=${members.number - 1})}" th:classappend="${members.first} ? 'disabled'">이전</a>
        <a th:each="p : ${#numbers.sequence(0, members.totalPages - 1)}"
           th:if="${p >= members.number - 2 and p <= members.number + 2}"
           th:href="@{/admin/members(page=${p})}" th:text="${p + 1}"
           th:classappend="${p == members.number} ? 'active'">1</a>
        <a th:href="@{/admin/members(page=${members.number + 1})}" th:classappend="${members.last} ? 'disabled'">다음</a>
    </div>
</main>

<script src="/js/admin/members.js"></script>
</body>
</html>
