<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 신고 관리 — 안전네비</title>
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/components.css}">
    <link rel="stylesheet" th:href="@{/css/admin/reports.css}">
    <link rel="stylesheet" th:href="@{/css/admin/reports-modal.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo/favicon.png}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="/js/common/csrf.js"></script>
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('reports')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">신고 관리</div>
            <div class="page-subtitle">접수된 신고를 확인하고 처리합니다. (페이지당 10건)</div>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="section-header">접수된 신고 (처리 필요)</div>
        <div class="table-container flat">
            <table class="admin-table kb-table-reports">
                <thead>
                <tr>
                    <th style="width:60px;">No.</th>
                    <th style="width:90px;">유형</th>
                    <th>신고 내용</th>
                    <th style="width:120px;">신고자</th>
                    <th style="width:150px;">접수일</th>
                    <th style="width:80px;">상태</th>
                    <th style="width:100px; text-align:right;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}" th:if="${report.status == 'RECEIVED'}">
                    <td style="color:var(--text-subtle);" th:text="${report.id}"></td>
                    <td><span class="target-type" th:text="'[' + ${report.targetType} + ']'"></span></td>
                    <td>
                        <div class="report-reason" th:text="${report.reason}"></div>
                        <div class="target-user"
                             th:text="${report.targetUser != null ? '대상: ' + report.targetUser : '대상 ID: ' + report.targetId}"></div>
                        <div th:if="${report.targetType == 'BOARD'}" style="margin-top:6px;">
                            <button class="btn-action-sm btn-view-post" th:data-id="${report.targetId}">게시글 보기</button>
                        </div>
                    </td>
                    <td th:text="${report.reporterNickname}"></td>
                    <td th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td><span class="status-badge pending">접수</span></td>
                    <td style="text-align:right;">
                        <button class="btn-action-sm btn-update-status" th:data-id="${report.id}" data-status="COMPLETED">처리완료</button>
                    </td>
                </tr>
                <tr th:if="${reports.isEmpty()}">
                    <td colspan="7" class="empty-msg" style="text-align:center; padding:40px; color:var(--text-subtle);">접수된 신고가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="section-header">처리 완료 내역</div>
        <div class="table-container flat">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:60px;">No.</th>
                    <th style="width:90px;">유형</th>
                    <th>신고 내용</th>
                    <th style="width:120px;">신고자</th>
                    <th style="width:130px;">접수일</th>
                    <th style="width:80px;">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}" th:if="${report.status == 'COMPLETED' or report.status == 'PROCESSED'}">
                    <td style="color:var(--text-subtle);" th:text="${report.id}"></td>
                    <td><span class="target-type" th:text="'[' + ${report.targetType} + ']'"></span></td>
                    <td th:text="${report.reason}"></td>
                    <td th:text="${report.reporterNickname}"></td>
                    <td th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd')}"></td>
                    <td><span class="status-badge completed">완료</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="admin-pagination" th:if="${reports.totalPages > 1}">
        <a th:href="@{/admin/reports(page=${reports.number - 1})}" th:classappend="${reports.first} ? 'disabled'">이전</a>
        <a th:each="p : ${#numbers.sequence(0, reports.totalPages - 1)}"
           th:if="${p >= reports.number - 2 and p <= reports.number + 2}"
           th:href="@{/admin/reports(page=${p})}" th:text="${p + 1}"
           th:classappend="${p == reports.number} ? 'active'">1</a>
        <a th:href="@{/admin/reports(page=${reports.number + 1})}" th:classappend="${reports.last} ? 'disabled'">다음</a>
    </div>
</main>

<div id="postModal" class="modal-overlay" style="display:none;">
    <div class="modal-window">
        <div class="modal-header">
            <h3>게시글 상세 보기</h3>
            <button class="modal-close" onclick="closePostModal()">×</button>
        </div>
        <div id="modal-content" class="modal-content"></div>
    </div>
</div>

<script src="/js/admin/admin-reports.js"></script>
</body>
</html>
