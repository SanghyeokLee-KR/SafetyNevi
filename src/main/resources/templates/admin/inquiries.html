<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 문의 관리, 안전네비</title>
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/components.css}">
    <link rel="stylesheet" th:href="@{/css/admin/inquiries.css}">
    <link rel="icon" type="image/png" href="/img/logo/favicon.png">
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('inquiries')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">1:1 문의 관리</div>
            <div class="page-subtitle">회원 문의를 확인하고 답변합니다.</div>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="section-header">
            미답변 문의
            <span th:text="|(${unansweredList.size()}건)|" style="font-size:0.78em; color:var(--text-muted); font-weight:600;">(0건)</span>
        </div>
        <div class="table-container flat">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:10%;">상태</th>
                    <th style="width:15%;">문의 유형</th>
                    <th style="width:40%;">제목</th>
                    <th style="width:15%;">작성자</th>
                    <th style="width:10%;">등록일</th>
                    <th style="width:10%; text-align:right;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(unansweredList)}">
                    <td colspan="6" style="text-align:center; padding:32px; color:var(--text-subtle);">처리 대기 중인 문의가 없습니다.</td>
                </tr>
                <tr th:each="item : ${unansweredList}">
                    <td><span class="status-badge waiting">답변 대기</span></td>
                    <td th:text="${item.category}">시스템 오류</td>
                    <td class="inquiry-subject">
                        <a th:href="@{/inquiry/detail/{id}(id=${item.id})}" th:text="${item.title}" style="text-decoration:none; color:inherit; font-weight:600;">제목</a>
                    </td>
                    <td th:text="${item.writerName + '(' + item.writerId + ')'}">user1</td>
                    <td th:text="${#temporals.format(item.createdDate, 'yyyy-MM-dd')}">2024-11-29</td>
                    <td style="text-align:right;">
                        <a th:href="@{/inquiry/detail/{id}(id=${item.id})}"><button class="btn-action-sm reply">답변하기</button></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="section-header">답변 완료 <span th:text="|(${answeredPage.totalElements}건)|" style="font-size:0.78em; color:var(--text-muted); font-weight:600;">(0건)</span></div>
        <div class="table-container flat">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width:10%;">상태</th>
                    <th style="width:15%;">문의 유형</th>
                    <th style="width:40%;">제목</th>
                    <th style="width:15%;">작성자</th>
                    <th style="width:10%;">답변일</th>
                    <th style="width:10%; text-align:right;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${answeredPage.isEmpty()}">
                    <td colspan="6" style="text-align:center; padding:32px; color:var(--text-subtle);">답변 완료된 내역이 없습니다.</td>
                </tr>
                <tr th:each="item : ${answeredPage.content}">
                    <td><span class="status-badge completed">답변 완료</span></td>
                    <td th:text="${item.category}">계정 문의</td>
                    <td class="inquiry-subject read">
                        <a th:href="@{/inquiry/detail/{id}(id=${item.id})}" th:text="${item.title}" style="text-decoration:none; color:inherit;">제목</a>
                    </td>
                    <td th:text="${item.writerName}">user2</td>
                    <td th:text="${item.answerDate != null ? #temporals.format(item.answerDate, 'yyyy-MM-dd') : '-'}">2024-11-28</td>
                    <td style="text-align:right;">
                        <a th:href="@{/inquiry/detail/{id}(id=${item.id})}"><button class="btn-action-sm view">조회</button></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-pagination" th:if="${answeredPage.totalPages > 1}">
            <a th:href="@{/admin/inquiries(page=${answeredPage.number - 1})}" th:classappend="${answeredPage.first} ? 'disabled'">이전</a>
            <a th:each="p : ${#numbers.sequence(0, answeredPage.totalPages - 1)}"
               th:if="${p >= answeredPage.number - 2 and p <= answeredPage.number + 2}"
               th:href="@{/admin/inquiries(page=${p})}" th:text="${p + 1}"
               th:classappend="${p == answeredPage.number} ? 'active'">1</a>
            <a th:href="@{/admin/inquiries(page=${answeredPage.number + 1})}" th:classappend="${answeredPage.last} ? 'disabled'">다음</a>
        </div>
    </div>
</main>

</body>
</html>
