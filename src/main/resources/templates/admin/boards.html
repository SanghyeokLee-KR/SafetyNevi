<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 · 게시물 관리 — 안전네비</title>
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/components.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo/favicon.png}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="/js/common/csrf.js"></script>
</head>
<body>

<aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('boards')}"></aside>

<main class="admin-content">
    <div class="page-header">
        <div>
            <div class="page-title">게시물 관리</div>
            <div class="page-subtitle">총 <strong th:text="${boards.totalElements}">0</strong>건 · 부적절한 게시글을 확인하고 삭제합니다.</div>
        </div>
    </div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th style="width:70px;">No.</th>
                <th style="width:110px;">카테고리</th>
                <th>제목</th>
                <th style="width:140px;">작성자</th>
                <th style="width:130px;">작성일</th>
                <th style="width:90px; text-align:right;">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${boards.content}">
                <td style="color:var(--text-subtle);" th:text="${b.id}">1</td>
                <td><span class="role-badge user" th:text="${b.category != null ? b.category : '기타'}">자유</span></td>
                <td style="font-weight:600;" th:text="${b.title}">게시글 제목</td>
                <td th:text="${b.writer}">작성자</td>
                <td th:text="${b.createdAt != null ? #temporals.format(b.createdAt, 'yyyy-MM-dd') : '-'}">2024-01-01</td>
                <td style="text-align:right;">
                    <button class="btn-danger-soft" th:data-id="${b.id}"
                            onclick="deleteBoard(this.getAttribute('data-id'))">삭제</button>
                </td>
            </tr>
            <tr th:if="${boards.totalElements == 0}">
                <td colspan="6" style="text-align:center; padding:48px; color:var(--text-subtle);">등록된 게시물이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="admin-pagination" th:if="${boards.totalPages > 1}">
        <a th:href="@{/admin/boards(page=${boards.number - 1})}" th:classappend="${boards.first} ? 'disabled'">이전</a>
        <a th:each="p : ${#numbers.sequence(0, boards.totalPages - 1)}"
           th:if="${p >= boards.number - 2 and p <= boards.number + 2}"
           th:href="@{/admin/boards(page=${p})}" th:text="${p + 1}"
           th:classappend="${p == boards.number} ? 'active'">1</a>
        <a th:href="@{/admin/boards(page=${boards.number + 1})}" th:classappend="${boards.last} ? 'disabled'">다음</a>
    </div>
</main>

<script>
    function deleteBoard(id) {
        if (!confirm('이 게시글을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        fetch('/api/admin/board/' + id, { method: 'DELETE' })
            .then(function (res) {
                if (res.ok) { location.reload(); }
                else { res.text().then(function (m) { alert('삭제 실패: ' + m); }); }
            })
            .catch(function () { alert('서버 통신 오류가 발생했습니다.'); });
    }
</script>
</body>
</html>
