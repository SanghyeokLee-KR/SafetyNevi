<!-- 🌟 상세 행동요령 모달 🌟 -->
<div id="disaster-modal" class="kb-modal-overlay">
    <div class="kb-modal-content">
        <button class="kb-modal-close" id="close-modal-x">X</button>

        <h2 class="kb-modal-title" id="modal-title"></h2>

        <!-- 🌟 1. 유튜브 영상 컨테이너 🌟 -->
        <div class="kb-video-container">
            <iframe id="disaster-youtube-player"
                    width="100%"
                    height="100%"
                    src=""
                    frameborder="0"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
            </iframe>
        </div>

        <div class="kb-modal-body" id="modal-content-body">
            <!-- JavaScript로 내용 채워짐 -->
        </div>

        <div class="kb-modal-footer">
            <button class="kb-modal-btn kb-btn-close">닫기</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const items = document.querySelectorAll('.kb-disaster-item');
        const modal = document.getElementById('disaster-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContentBody = document.getElementById('modal-content-body');
        const youtubePlayer = document.getElementById('disaster-youtube-player');

        const closeBtnX = document.getElementById('close-modal-x');
        const closeBtnFooter = document.querySelector('.kb-btn-close');

        // 🌟 순수 HTML 속성에서 데이터를 가져와 모달 내용을 구성하는 함수 🌟
        function generateGuideHtml(itemElement) {
            const preItems = itemElement.getAttribute('data-pre').split(',').map(s => s.trim()).filter(s => s.length > 0);
            const duringItems = itemElement.getAttribute('data-during').split(',').map(s => s.trim()).filter(s => s.length > 0);

            let html = '';

            // 1. 발생 전 준비 사항
            html += '<h3 class="kb-guide-step-title">재난 발생 전 준비 사항</h3>';
            html += '<ul class="kb-guide-list">';
            preItems.forEach(item => { html += `<li>${item}</li>`; });
            html += '</ul>';

            // 2. 발생 시 행동 요령
            html += '<h3 class="kb-guide-step-title">재난 발생 시 행동 요령</h3>';
            html += '<ul class="kb-guide-list">';
            duringItems.forEach(item => { html += `<li>${item}</li>`; });
            html += '</ul>';

            return html;
        }

        // 모달 열기 및 내용 변경 함수
        function openModal(itemElement, disasterName) {
            const videoId = itemElement.getAttribute('data-video-id');

            modalTitle.textContent = `${disasterName} 행동 요령`;
            modalContentBody.innerHTML = generateGuideHtml(itemElement);

            // 🌟 유튜브 링크 설정 (data-video-id 사용) 🌟
            if (videoId) {
                const videoUrl = `https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0`;
                youtubePlayer.src = videoUrl;
            } else {
                youtubePlayer.src = ''; // 영상이 없으면 비웁니다.
            }

            modal.style.display = 'flex';
        }

        // 모달 닫기 함수
        function closeModal() {
            modal.style.display = 'none';
            // 🌟 모달 닫을 때 영상 재생 중지 (필수) 🌟
            youtubePlayer.src = '';
        }

        // 항목 클릭 이벤트
        items.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const disaster = this.getAttribute('data-disaster');
                openModal(this, disaster); // 항목 요소 자체를 전달
            });
        });

        // 닫기 버튼 이벤트
        closeBtnX.addEventListener('click', closeModal);
        closeBtnFooter.addEventListener('click', closeModal);

        // 오버레이 클릭 시 닫기
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
    });
</script>
