<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전네비</title>
    <link rel="stylesheet" href="/css/base/tokens.css">
    <link rel="stylesheet" href="/css/base/components.css">
    <link rel="stylesheet" href="/css/index/index.css">
    <link rel="icon" type="image/png" href="/img/logo/favicon.png">
</head>
<body class="sn-body">

<div class="home-wrap">
    <main class="home-main">
        <a href="/" class="home-brand">
            <img src="/img/logo/200px-안전네비_로고.png" alt="안전네비 로고">
            <h1>안전네비</h1>
        </a>
        <p class="home-tagline">위급할 때 가장 가까운 안전으로</p>

        <div sec:authorize="isAuthenticated()" class="home-greeting">
            <a href="/myInfo" class="sn-link"><span sec:authentication="name"></span>님</a> 반갑습니다.
            <form th:action="@{/logout}" method="post" class="home-logout">
                <button type="submit">로그아웃</button>
            </form>
        </div>

        <nav class="nav-grid">
            <a sec:authorize="isAnonymous()" href="/login" class="nav-card">
                <span class="nav-tile nav-tile--blue"><span class="nav-ic" style="--ic:url('/img/icons/nav/log-in.svg')"></span></span>
                <span class="nav-card__label">로그인</span>
                <span class="nav-card__desc">서비스 이용 시작</span>
            </a>
            <a sec:authorize="isAnonymous()" href="/signup" class="nav-card">
                <span class="nav-tile nav-tile--blue"><span class="nav-ic" style="--ic:url('/img/icons/nav/user-plus.svg')"></span></span>
                <span class="nav-card__label">회원가입</span>
                <span class="nav-card__desc">3분이면 충분해요</span>
            </a>

            <a sec:authorize="isAuthenticated()" href="/disasterMessage" class="nav-card">
                <span class="nav-tile nav-tile--red"><span class="nav-ic" style="--ic:url('/img/icons/nav/siren.svg')"></span></span>
                <span class="nav-card__label">재난문자</span>
                <span class="nav-card__desc">실시간 재난 알림</span>
            </a>
            <a sec:authorize="isAuthenticated()" href="/map" class="nav-card">
                <span class="nav-tile nav-tile--green"><span class="nav-ic" style="--ic:url('/img/icons/nav/shield-check.svg')"></span></span>
                <span class="nav-card__label">인근 대피소</span>
                <span class="nav-card__desc">내 주변 안전 시설</span>
            </a>

            <a href="/notice" class="nav-card">
                <span class="nav-tile nav-tile--blue"><span class="nav-ic" style="--ic:url('/img/icons/nav/megaphone.svg')"></span></span>
                <span class="nav-card__label">공지사항</span>
                <span class="nav-card__desc">서비스 소식</span>
            </a>
            <a href="/disasterGuide" class="nav-card">
                <span class="nav-tile nav-tile--blue"><span class="nav-ic" style="--ic:url('/img/icons/nav/book-open.svg')"></span></span>
                <span class="nav-card__label">재난 대피요령</span>
                <span class="nav-card__desc">상황별 행동 요령</span>
            </a>
        </nav>
    </main>

    <footer class="home-footer">
        <div class="home-footer__nav">
            <a href="#">이용안내</a>
            <a href="#">저작권정책</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">기관소개</a>
            <a href="https://plus.gov.kr/">정부24</a>
        </div>
        <div class="home-footer__info">
            <p>인천광역시 미추홀구 인하로 100 (인하공업전문대학)</p>
            <p>안전네비 콜센터 032-6974-5885</p>
            <p class="home-footer__copy">© Safety Nevi. All Rights Reserved.</p>
        </div>
    </footer>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'denied') {
            alert("접근 권한이 없습니다. 관리자만 접근 가능합니다.");
            const url = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: url}, '', url);
        }
    });
</script>

</body>
</html>
