# H2 인메모리 프로파일. Oracle과 Docker 없이 로컬에서 바로 띄우기 위한 설정입니다.
# 실행: ./gradlew bootRun --args='--spring.profiles.active=h2'
#
# 비밀값이 없으므로 이 파일은 저장소에 포함합니다.
# 외부 API 키는 비워 두었고, 키가 필요한 기능(날씨·지도·재난문자 수집)은 해당 화면에서만 동작하지 않습니다.
# 지도·게시판·회원·대피소 조회 등 나머지 흐름은 키 없이 확인할 수 있습니다.

# ==========================================
# Server & Application Settings
# ==========================================
server.port=9090
spring.application.name=SafetyNevi

# ==========================================
# H2 In-Memory Database
# ==========================================
spring.datasource.url=jdbc:h2:mem:safetynevi;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA Settings
# ==========================================
# 인메모리라 기동마다 새로 만듭니다.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# File Upload Configuration
# ==========================================
file.upload.dir=./data/upload
file.upload.inquiry=./data/upload/inquiry
file.upload.notice=./data/upload/notice

# ==========================================
# External API Keys
# ==========================================
# 비워 두면 해당 외부 연동만 비활성 상태로 뜹니다.
api.kma.serviceKey=
api.kakao.restKey=
api.kakao.jsKey=
api.disaster.serviceKey=
