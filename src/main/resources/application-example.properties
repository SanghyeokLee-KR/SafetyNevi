# ==========================================
# Server & Application Settings
# ==========================================
server.port=9090
spring.application.name=SafetyNevi

# ==========================================
# Oracle Database Configuration
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# File Upload Configuration
# ==========================================
file.upload.dir=YOUR_UPLOAD_PATH
file.upload.inquiry=YOUR_INQUIRY_UPLOAD_PATH
file.upload.notice=YOUR_NOTICE_UPLOAD_PATH

# ==========================================
# External API Keys
# ==========================================
api.kma.serviceKey=YOUR_KMA_SERVICE_KEY
api.kakao.restKey=YOUR_KAKAO_REST_KEY
api.kakao.jsKey=YOUR_KAKAO_JS_KEY
# 행정안전부 긴급재난문자 API (재난안전데이터공유플랫폼 / data.go.kr 15134001) — 인증키(Encoding) 형태
api.disaster.serviceKey=YOUR_DISASTER_MSG_SERVICE_KEY

# ==========================================
# 웹푸시 (미접속 사용자에게 재난 알림) — 표준 Web Push(VAPID), 외부 계정 불필요
# 키쌍 생성: `npx web-push generate-vapid-keys` 또는 openssl (public=65바이트 base64url, private=32바이트 base64url).
# 비우면 발송만 비활성화되고 앱은 정상 동작한다. subject 는 운영자 연락처(mailto: 또는 https:).
# ==========================================
webpush.vapid.public-key=YOUR_VAPID_PUBLIC_KEY
webpush.vapid.private-key=YOUR_VAPID_PRIVATE_KEY
webpush.vapid.subject=mailto:admin@example.com

# ==========================================
# 로깅 (ELK 연동: ECS JSON 로그 파일)
# logs/safetynevi.log 를 Filebeat/Logstash가 수집 -> Elasticsearch -> Kibana
# ==========================================
logging.structured.format.file=ecs
logging.file.name=logs/safetynevi.log
logging.level.com.inha.pro.safetynevi=INFO

# ==========================================
# Actuator (모니터링/헬스체크) + Graceful Shutdown
# health=공개(로드밸런서), 그 외(prometheus/info)는 ADMIN (SecurityConfig 참조)
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==========================================
# Redis · Kafka (운영 prod 에서만 씀. 로컬/테스트는 오토컨피그 빼서 불필요)
#  Redis: 캐시 + 세션 + 레이트리밋  /  Kafka: 재난 이벤트  (compose 의 redis·kafka 서비스)
# ==========================================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.inha.pro.safetynevi.dto.calamity.DisasterEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.inha.pro.safetynevi.dto.calamity

