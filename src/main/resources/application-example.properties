# ==========================================
# Server & Application Settings
# ==========================================
server.port=9090
spring.application.name=SafetyNevi

# ==========================================
# Oracle Database Configuration
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# File Upload Configuration
# ==========================================
file.upload.dir=YOUR_UPLOAD_PATH
file.upload.inquiry=YOUR_INQUIRY_UPLOAD_PATH
file.upload.notice=YOUR_NOTICE_UPLOAD_PATH

# ==========================================
# External API Keys
# ==========================================
api.kma.serviceKey=YOUR_KMA_SERVICE_KEY
api.kakao.restKey=YOUR_KAKAO_REST_KEY
api.kakao.jsKey=YOUR_KAKAO_JS_KEY
# 행정안전부 긴급재난문자 API (재난안전데이터공유플랫폼 / data.go.kr 15134001) — 인증키(Encoding) 형태
api.disaster.serviceKey=YOUR_DISASTER_MSG_SERVICE_KEY

# ==========================================
# 로깅 (ELK 연동: ECS JSON 로그 파일)
# logs/safetynevi.log 를 Filebeat/Logstash가 수집 -> Elasticsearch -> Kibana
# ==========================================
logging.structured.format.file=ecs
logging.file.name=logs/safetynevi.log
logging.level.com.inha.pro.safetynevi=INFO

