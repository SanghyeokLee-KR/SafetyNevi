name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 백엔드 컴파일 + 단위/통합 테스트 (H2 테스트 프로파일, 외부 키 불필요)
      - name: Build and test
        run: ./gradlew test compileJava --no-daemon

      # 프론트엔드(TypeScript) 타입체크 — Node는 gradle node 플러그인이 자동 설치
      - name: Frontend type-check
        run: ./gradlew buildFrontend --no-daemon
