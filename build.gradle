plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.inha.pro'
version = '0.0.1-SNAPSHOT'
description = 'SafetyNevi'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'com.oracle.database.jdbc:ojdbc11'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    implementation 'org.jsoup:jsoup:1.17.2'

    // 1. CSV 파일 처리를 위한 OpenCSV 라이브러리
    implementation 'com.opencsv:opencsv:5.9'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 1. 비밀번호 암호화용 (Spring Security)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 2. 정규식 검사용 (Validation)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Thymeleaf Spring Security 확장 (로그인 여부 판단용)
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 모니터링/헬스체크 (Actuator) + Prometheus 메트릭 노출
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // 캐시 (Caffeine, 로컬용)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 운영용 - Redis(캐시·세션·레이트리밋) + Kafka(재난 이벤트). prod 에서만 씀
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 프론트엔드(TypeScript) 빌드: frontend/src/*.ts -> static/js (gradle 빌드에 자동 포함)
node {
    version = '24.16.0'
    download = true
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    // 주의: 산출물이 src 안(static/js)이라 outputs.dir 로 선언하면 gradle이 다른 태스크 실행 때
    // 이 디렉터리를 stale 출력으로 보고 삭제해버린다. 그래서 inputs/outputs 미선언(매번 tsc 실행).
}

// 프론트 빌드는 실행(bootRun)·패키징(bootJar)에만 연결 — 단위테스트는 프론트 빌드 없이 돌게
tasks.named('bootJar') { dependsOn 'buildFrontend' }
tasks.named('processResources') { mustRunAfter 'buildFrontend' }

// 로컬 h2 실행용: bootRun 클래스패스에만 H2 주입 (운영 jar 는 깨끗 + build.gradle 플립 불필요)
configurations { localH2 }
dependencies { localH2 'com.h2database:h2' }
tasks.named('bootRun') {
    dependsOn 'buildFrontend'
    classpath += configurations.localH2
}